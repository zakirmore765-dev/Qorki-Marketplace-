<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የእቃ ማስታወቂያ እና መገበያያ ገጽ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 25px;
        }

        .header-brand h2 {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
        }

        .sell-btn {
            background-color: #ff9800;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .sell-btn:hover {
            background-color: #e68a00;
        }

        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 15px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .search-input {
            flex: 2;
            min-width: 250px;
        }

        .filter-select {
            flex: 1;
            min-width: 150px;
            cursor: pointer;
        }

        .sell-link {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header>
            <div class="header-brand">
                <h2>ገበያ</h2>
            </div>
            
            <!-- የሚሰራው የ Sell Button ሊንክ -->
            <a href="project.html" class="sell-link">
                <button class="sell-btn">+ ሽጥ (Sell)</button>
            </a>
        </header>

        <!-- Search & Filter Section -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="ምን መግዛት ይፈልጋሉ...">
            <select class="filter-select">
                <option value="">ኤሌክትሮኒክስ</option>
                <option value="phones">ስልኮች</option>
                <option value="laptops">ላፕቶፖች</option>
            </select>
            <select class="filter-select">
                <option value="">አዲስ አበባ</option>
                <option value="nazret">አዳማ</option>
                <option value="hawassa">ሐዋሳ</option>
            </select>
        </div>
    </div>

</body>
</html>
