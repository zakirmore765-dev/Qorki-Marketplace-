<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qorki Marketplace - ዕቃ መሸጫ እና ክፍያ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .home-btn {
            background-color: #2a2a2a;
            color: #ff9800;
            border: 1px solid #ff9800;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background-color: #ff9800;
            color: #000;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #ff9800;
        }

        /* የክፍያ ዋጋ ማሳያ ሣጥን */
        .price-box {
            background-color: #2a2a2a;
            border: 2px dashed #ff9800;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        .price-box h3 {
            color: #4caf50;
            font-size: 22px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        input:focus, textarea:focus {
            border-color: #ff9800;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #ff9800;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #e68a00;
        }

        .divider {
            height: 1px;
            background-color: #333;
            margin: 25px 0;
        }

        #result-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success { background-color: #1b5e20; color: #4caf50; }
        .error { background-color: #b71c1c; color: #ff8a80; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation with Home Button -->
        <div class="top-nav">
            <a href="/" class="home-btn">🏠 ወደ ዋና ገጽ (Home)</a>
            <span style="color: #aaa; font-size: 14px;">Qorki Marketplace</span>
        </div>

        <!-- Section 1: የእቃ መረጃ መሙያ -->
        <h2>1. የእቃ መረጃ ያስገቡ</h2>
        <form id="sellForm">
            <div class="form-group">
                <label>የእቃው ስም</label>
                <input type="text" id="itemName" placeholder="ለምሳሌ: Samsung Galaxy S21" required>
            </div>
            <div class="form-group">
                <label>የእቃው ዋጋ (በብር)</label>
                <input type="number" id="itemPrice" placeholder="ለምሳሌ: 15000" required>
            </div>
            <div class="form-group">
                <label>የእቃው መግለጫ / ዝርዝር</label>
                <textarea id="itemDesc" rows="3" placeholder="የእቃውን ሁኔታ እና ዝርዝር መረጃ ይፃፉ..."></textarea>
            </div>
        </form>

        <div class="divider"></div>

        <!-- Section 2: የክፍያ መረጃ እና ማረጋገጫ -->
        <h2>2. የማስታወቂያ ክፍያ</h2>
        
        <!-- የስንት ብር ክፍያ እንደሆነ የሚያሳየው ቦታ -->
        <div class="price-box">
            <p style="color: #aaa; font-size: 14px;">የማስታወቂያ አገልግሎት ክፍያ</p>
            <h3>5.00 ETB (ብር)</h3>
            <p style="font-size: 12px; color: #888; margin-top: 5px;">ይህንን ክፍያ በ ቴሌብር (Telebirr) ይክፈሉ</p>
        </div>

        <div class="form-group">
            <label>Transaction Number (TxID)</label>
            <input type="text" id="txNumber" placeholder="የቴሌብር SMS ላይ የመጣውን Transaction ID ያስገቡ" required>
        </div>

        <button type="button" class="submit-btn" onclick="verifyPayment()">ክፍያን አረጋግጥ እና ለጥፍ</button>

        <div id="result-message"></div>
    </div>

    <script>
        async function verifyPayment() {
            const txNumber = document.getElementById('txNumber').value.trim();
            const messageBox = document.getElementById('result-message');

            if (!txNumber) {
                alert("እባክዎን የ Transaction ቁጥር ያስገቡ!");
                return;
            }

            messageBox.style.display = 'block';
            messageBox.className = '';
            messageBox.innerText = 'ክፍያው እየተረጋገጠ ነው...';

            try {
                const response = await fetch('/api/verify-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ txNumber: txNumber })
                });

                const data = await response.json();

                if (data.success) {
                    messageBox.className = 'success';
                    messageBox.innerText = data.message;
                } else {
                    messageBox.className = 'error';
                    messageBox.innerText = data.message;
                }
            } catch (err) {
                messageBox.className = 'error';
                messageBox.innerText = 'ከሰርቨር ጋር መገናኘት አልተቻለም!';
            }
        }
    </script>

</body>
</html>
